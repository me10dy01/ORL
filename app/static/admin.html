<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星辰数码商城 · 知识库管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="admin">
    <header class="admin-header">
      <h1>知识库管理</h1>
      <a href="/">← 返回客服</a>
    </header>

    <section class="card">
      <h2>上传文档</h2>
      <p class="hint">支持 <strong>Markdown (.md) / txt / pdf / docx</strong>。上传后自动提取文本、切分、向量化并入库（按文件内容 hash 去重）。</p>
      <div class="upload-row">
        <input type="file" id="file-input" accept=".md,.markdown,.txt,.pdf,.docx">
        <button id="upload-btn" class="btn primary">上传并入库</button>
      </div>
      <div id="upload-result" class="result"></div>
    </section>

    <section class="card">
      <h2>已入库文档</h2>
      <table id="doc-table">
        <thead>
          <tr><th>文件名</th><th>document_id</th><th>chunk 数</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="doc-action-result" class="result"></div>
      <input type="file" id="modify-input" accept=".md,.markdown,.txt,.pdf,.docx" hidden>
    </section>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>
